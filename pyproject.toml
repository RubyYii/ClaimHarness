[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.41,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-harness"
version = "0.4.0"
description = "ProblemBridge + ClaimHarness: local-first deterministic workflow alignment and rule-based claim-evidence screening."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0,<3",
  "pandas>=2.0,<4",
  "pypdf>=4.0,<7",
  "typer>=0.12,<1",
  # Typer 0.15.x is the constrained release version. Click 8.2 changed CLI
  # rendering APIs used by that line, so keep unconstrained installs safe too.
  "click>=8.1.7,<8.2",
  "rich>=13.0,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "build>=1.2,<2",
]
ui = [
  "streamlit>=1.35,<2",
]
ocr = [
  "pytesseract>=0.3.10,<1",
  "pdf2image>=1.17,<2",
  "Pillow>=10.0,<13",
]

[project.scripts]
claim-harness = "claim_harness.cli:main"
problem-bridge = "problem_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["claim_harness*", "problem_bridge*"]

[tool.setuptools.package-data]
claim_harness = [
  "prompts/*.md",
  "demo_data/*.md",
  "demo_data/tables/*.csv",
  "eval_data/*.jsonl",
]
problem_bridge = ["demo_data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp_run"
