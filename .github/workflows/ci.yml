name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -c requirements/constraints.txt -e ".[dev,ui]"

      - name: Run tests
        run: python -m pytest

  release-gate:
    runs-on: windows-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tested release dependencies
        run: python -m pip install -c requirements/constraints.txt -e ".[dev,ui]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Build and smoke-test local release ZIP
        shell: powershell
        run: .\scripts\build_and_test_release_powershell.ps1 -PythonExe (Get-Command python).Source
