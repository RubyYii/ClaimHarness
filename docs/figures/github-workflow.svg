<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Guided workflow from intake to audit</title>
  <desc id="desc">Document intake feeds question discovery, workflow alignment, AI task checking, generated outputs, and ClaimHarness evidence audit.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="54" y="58" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Guided workflow handoffs</text>
  <text x="54" y="88" fill="#5b6978" font-family="Segoe UI, Arial, sans-serif" font-size="16">Each step passes a seed into the next form so users do not restart from a blank prompt.</text>

  <g transform="translate(58 134)">
    <rect x="0" y="0" width="188" height="112" rx="10" fill="#f1f8f7" stroke="#79bfb4" stroke-width="2"/>
    <text x="20" y="34" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">1. Document intake</text>
    <text x="20" y="64" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">Word, PDF, webpage,</text>
    <text x="20" y="84" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">image OCR, pasted text</text>

    <path d="M198 56 H246" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <path d="M246 56 l-10 -7 v14 z" fill="#718096"/>

    <rect x="258" y="0" width="188" height="112" rx="10" fill="#eef4ff" stroke="#9eb7ef" stroke-width="2"/>
    <text x="278" y="34" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">2. Questions</text>
    <text x="278" y="64" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">What to ask, who to ask,</text>
    <text x="278" y="84" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">unknowns to validate</text>

    <path d="M456 56 H504" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <path d="M504 56 l-10 -7 v14 z" fill="#718096"/>

    <rect x="516" y="0" width="188" height="112" rx="10" fill="#fff7e6" stroke="#e9b85d" stroke-width="2"/>
    <text x="536" y="34" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">3. Workflow</text>
    <text x="536" y="64" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">Pain points, materials,</text>
    <text x="536" y="84" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">human boundaries</text>

    <path d="M714 56 H762" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <path d="M762 56 l-10 -7 v14 z" fill="#718096"/>

    <rect x="774" y="0" width="188" height="112" rx="10" fill="#fef2f2" stroke="#f0a1a1" stroke-width="2"/>
    <text x="794" y="34" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">4. AI task check</text>
    <text x="794" y="64" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">Task spec, evidence,</text>
    <text x="794" y="84" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">evaluation alignment</text>
  </g>

  <g transform="translate(187 318)">
    <rect x="0" y="0" width="240" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="22" y="34" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">5. View and export</text>
    <text x="22" y="64" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">Inspect technical files,</text>
    <text x="22" y="84" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">export Word or PDF</text>

    <path d="M252 52 H318" stroke="#718096" stroke-width="3" stroke-linecap="round"/>
    <path d="M318 52 l-10 -7 v14 z" fill="#718096"/>

    <rect x="330" y="0" width="250" height="104" rx="10" fill="#f3f7f0" stroke="#a6c88f" stroke-width="2"/>
    <text x="352" y="34" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">6. ClaimHarness audit</text>
    <text x="352" y="64" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">Claim table, evidence map,</text>
    <text x="352" y="84" fill="#506172" font-family="Segoe UI, Arial, sans-serif" font-size="13">audit report, trace log</text>
  </g>

  <path d="M1020 190 C1096 208 1096 346 780 370" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="7 8"/>
  <text x="842" y="406" fill="#5b6978" font-family="Segoe UI, Arial, sans-serif" font-size="14">Evidence contract can later connect ProblemBridge to ClaimHarness.</text>
</svg>
