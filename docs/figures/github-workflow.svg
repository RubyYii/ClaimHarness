<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Guided workflow from problem alignment to evidence audit</title>
  <desc id="desc">A monochrome five-stage workflow. Document intake leads to question discovery, workflow alignment, and AI task checking in ProblemBridge. When text and results exist, a final handoff leads to ClaimHarness evidence audit.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#17324d"/>
    </marker>
  </defs>

  <rect width="1200" height="440" fill="#ffffff"/>

  <text x="40" y="50" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800">Guided workflow: problem alignment to evidence audit</text>
  <text x="40" y="80" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="15">Each stage names the artifact handed forward. Straight arrows show the only workflow direction.</text>

  <text x="40" y="118" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">PROBLEMBRIDGE · BEFORE AI WORK</text>
  <line x1="40" y1="130" x2="880" y2="130" stroke="#9aabb9" stroke-width="1.5"/>

  <text x="980" y="118" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">CLAIMHARNESS</text>
  <line x1="980" y1="130" x2="1160" y2="130" stroke="#9aabb9" stroke-width="1.5"/>

  <line x1="930" y1="106" x2="930" y2="360" stroke="#c3ced7" stroke-width="1.5" stroke-dasharray="5 6"/>

  <g transform="translate(40 145)">
    <rect width="180" height="200" rx="12" fill="#f4f7f9" stroke="#8fa2b2" stroke-width="1.5"/>
    <circle cx="22" cy="25" r="13" fill="#17324d"/>
    <text x="22" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">1</text>
    <text x="43" y="30" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">INTAKE</text>
    <text x="18" y="69" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Document intake</text>
    <text x="18" y="99" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">Extract text, tables,</text>
    <text x="18" y="119" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">annotations and warnings</text>
    <line x1="18" y1="142" x2="162" y2="142" stroke="#c3ced7" stroke-width="1"/>
    <text x="18" y="163" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">OUTPUT</text>
    <text x="18" y="184" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">problem_seed.md</text>
  </g>

  <path d="M228 245 H252" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(260 145)">
    <rect width="180" height="200" rx="12" fill="#f4f7f9" stroke="#8fa2b2" stroke-width="1.5"/>
    <circle cx="22" cy="25" r="13" fill="#17324d"/>
    <text x="22" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">2</text>
    <text x="43" y="30" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">DISCOVER</text>
    <text x="18" y="69" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Question discovery</text>
    <text x="18" y="99" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">Find questions, people,</text>
    <text x="18" y="119" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">and unknowns to validate</text>
    <line x1="18" y1="142" x2="162" y2="142" stroke="#c3ced7" stroke-width="1"/>
    <text x="18" y="163" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">OUTPUT</text>
    <text x="18" y="184" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">question brief</text>
  </g>

  <path d="M448 245 H472" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(480 145)">
    <rect width="180" height="200" rx="12" fill="#f4f7f9" stroke="#8fa2b2" stroke-width="1.5"/>
    <circle cx="22" cy="25" r="13" fill="#17324d"/>
    <text x="22" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">3</text>
    <text x="43" y="30" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ALIGN</text>
    <text x="18" y="69" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Workflow alignment</text>
    <text x="18" y="99" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">Map workflow, evidence,</text>
    <text x="18" y="119" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">pain points and boundaries</text>
    <line x1="18" y1="142" x2="162" y2="142" stroke="#c3ced7" stroke-width="1"/>
    <text x="18" y="163" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">OUTPUT</text>
    <text x="18" y="184" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">alignment package</text>
  </g>

  <path d="M668 245 H692" fill="none" stroke="#17324d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(700 145)">
    <rect width="180" height="200" rx="12" fill="#f4f7f9" stroke="#8fa2b2" stroke-width="1.5"/>
    <circle cx="22" cy="25" r="13" fill="#17324d"/>
    <text x="22" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">4</text>
    <text x="43" y="30" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">CHECK</text>
    <text x="18" y="69" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">AI task check</text>
    <text x="18" y="99" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">Check task, inputs,</text>
    <text x="18" y="119" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">metrics and review roles</text>
    <line x1="18" y1="142" x2="162" y2="142" stroke="#c3ced7" stroke-width="1"/>
    <text x="18" y="163" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">OUTPUT</text>
    <text x="18" y="184" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">reviewed task spec</text>
  </g>

  <rect x="887" y="222" width="86" height="20" rx="10" fill="#ffffff"/>
  <text x="930" y="236" text-anchor="middle" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.6">OUTPUTS EXIST</text>
  <path d="M888 255 H972" fill="none" stroke="#17324d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(980 145)">
    <rect width="180" height="200" rx="12" fill="#e6edf2" stroke="#17324d" stroke-width="2"/>
    <circle cx="22" cy="25" r="13" fill="#17324d"/>
    <text x="22" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">5</text>
    <text x="43" y="30" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">AUDIT</text>
    <text x="18" y="69" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">ClaimHarness audit</text>
    <text x="18" y="99" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">Check claims against</text>
    <text x="18" y="119" fill="#4f6477" font-family="Segoe UI, Arial, sans-serif" font-size="13">the provided evidence</text>
    <line x1="18" y1="142" x2="162" y2="142" stroke="#9aabb9" stroke-width="1"/>
    <text x="18" y="163" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">OUTPUT</text>
    <text x="18" y="184" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">audit package + trace</text>
  </g>

  <path d="M40 374 V365 M40 374 H880 M880 374 V365" fill="none" stroke="#9aabb9" stroke-width="1.5"/>
  <text x="460" y="400" text-anchor="middle" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Local workbench · deterministic mock by default · view and export after generation</text>

  <path d="M980 374 V365 M980 374 H1160 M1160 374 V365" fill="none" stroke="#9aabb9" stroke-width="1.5"/>
  <text x="1070" y="400" text-anchor="middle" fill="#5e7387" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">CLI + static viewer</text>
</svg>
