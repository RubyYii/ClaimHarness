<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">OCR setup flow</title>
  <desc id="desc">A local-first OCR setup flow from files to optional OCR to Document Intake outputs.</desc>
  <rect width="1200" height="675" fill="#fbfaf7"/>
  <path d="M90 95c120-35 245-33 375-8 156 30 284 18 430-5 80-13 150-9 215 17" fill="none" stroke="#d7d1c4" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
  <text x="80" y="70" fill="#1f2937" font-family="Arial, sans-serif" font-size="34" font-weight="700">OCR is optional / OCR 是可选项</text>
  <text x="82" y="112" fill="#4b5563" font-family="Arial, sans-serif" font-size="20">Default intake reads text files directly. OCR is only used for scans or images when enabled.</text>

  <g transform="translate(95 185)">
    <rect x="0" y="0" width="225" height="150" rx="18" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
    <path d="M66 36h84l32 32v57H66z" fill="#e0f2fe" stroke="#2563eb" stroke-width="3"/>
    <path d="M150 36v33h32" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="112" y="92" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="22" font-weight="700">Files</text>
    <text x="112" y="128" text-anchor="middle" fill="#4b5563" font-family="Arial, sans-serif" font-size="17">PDF / image / doc</text>
  </g>

  <g transform="translate(380 185)">
    <rect x="0" y="0" width="225" height="150" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
    <circle cx="74" cy="72" r="34" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
    <path d="M63 72h22M74 61v22M119 47h53M119 75h73M119 103h43" stroke="#c2410c" stroke-width="6" stroke-linecap="round"/>
    <text x="112" y="128" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="18" font-weight="700">Enable optional OCR</text>
  </g>

  <g transform="translate(665 185)">
    <rect x="0" y="0" width="225" height="150" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <rect x="54" y="38" width="117" height="82" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <path d="M75 65h75M75 88h56" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
    <text x="112" y="145" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="18" font-weight="700">extracted_text.md</text>
  </g>

  <g transform="translate(950 185)">
    <rect x="0" y="0" width="170" height="150" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <path d="M42 49h86M42 76h86M42 103h54" stroke="#4338ca" stroke-width="7" stroke-linecap="round"/>
    <circle cx="129" cy="105" r="17" fill="#f97316"/>
    <text x="85" y="145" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="18" font-weight="700">problem_seed.md</text>
  </g>

  <path d="M322 260h50" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 247l17 13-17 13" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M607 260h50" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M645 247l17 13-17 13" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M892 260h50" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M930 247l17 13-17 13" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(120 420)">
    <rect x="0" y="0" width="960" height="150" rx="24" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
    <text x="40" y="48" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">What OCR does / OCR 做什么</text>
    <text x="40" y="88" fill="#374151" font-family="Arial, sans-serif" font-size="21">It turns visible text in scans or images into rough editable text.</text>
    <text x="40" y="122" fill="#374151" font-family="Arial, sans-serif" font-size="21">它把扫描件或图片里的可见文字，转成可编辑的粗略文本。</text>
    <text x="625" y="88" fill="#b91c1c" font-family="Arial, sans-serif" font-size="21" font-weight="700">It does not understand figures.</text>
    <text x="625" y="122" fill="#b91c1c" font-family="Arial, sans-serif" font-size="21" font-weight="700">它不理解图像含义或专业结论。</text>
  </g>
</svg>
